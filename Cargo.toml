[package]
name = "minimum-hw-project"
version = "0.1.0"
edition = "2021"
description = "Raspberry Pi 3 gRPC hardware project with 2 push switches and debug log receiver"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.1"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22"

[build-dependencies]
tonic-build = "0.12"
protobuf-src = "2.1"

[[bin]]
name = "pi_node"
path = "src/bin/pi_node.rs"

[[bin]]
name = "log_receiver"
path = "src/bin/log_receiver.rs"
